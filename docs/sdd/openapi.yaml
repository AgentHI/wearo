components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wearo_session
      description: HttpOnly secure session cookie; mutating operations additionally require anti-CSRF
        token.
    gatewaySignature:
      type: apiKey
      in: header
      name: X-Gateway-Signature
      description: Provider specific signed webhook + allowlist/status verification.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
      additionalProperties: false
    Principal:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - CONSUMER
          - BUSINESS
          - ADMIN
        verified:
          type: boolean
        tenant_id:
          type: string
        role:
          type: string
        account_id:
          type: string
        csrf_token:
          type: string
          description: Returned only when a browser session is established.
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - type
      - verified
      additionalProperties: false
    PersonProfileWrite:
      type: object
      properties:
        person_asset_id: {type: string, format: uuid}
        consent_id: {type: string, format: uuid}
        height_cm: {type: number, minimum: 80, maximum: 260}
        weight_kg: {type: number, minimum: 20, maximum: 350}
      required: [person_asset_id, consent_id]
      additionalProperties: false
    PersonProfile:
      allOf:
      - $ref: '#/components/schemas/PersonProfileWrite'
      - type: object
        properties:
          id: {type: string, format: uuid}
          status: {type: string, enum: [ACTIVE, DELETION_REQUESTED]}
          last_used_at: {type: [string, 'null'], format: date-time}
        required: [id, status]
    DailyAllowance:
      type: object
      properties:
        successful_limit: {type: integer, const: 3}
        successful_used: {type: integer, minimum: 0, maximum: 3}
        remaining: {type: integer, minimum: 0, maximum: 3}
        resets_at: {type: string, format: date-time}
        active_job_id: {type: [string, 'null'], format: uuid}
      required: [successful_limit, successful_used, remaining, resets_at]
      additionalProperties: false
    OtpRequest:
      type: object
      properties:
        destination:
          type: string
        purpose:
          type: string
          enum:
          - SIGN_IN
          - BUSINESS_SIGN_IN
          - STAFF_INVITE
      required:
      - destination
      - purpose
      additionalProperties: false
    OtpVerify:
      type: object
      properties:
        challenge_id:
          type: string
        code:
          type: string
          minLength: 4
          maxLength: 10
      required:
      - challenge_id
      - code
      additionalProperties: false
    OtpChallenge:
      type: object
      properties:
        challenge_id:
          type: string
        expires_at:
          type: string
          format: date-time
        resend_after_seconds:
          type: integer
          minimum: 0
        message:
          type: string
      required:
      - challenge_id
      - expires_at
      additionalProperties: false
    Category:
      type: object
      properties:
        code:
          type: string
        display_name:
          type: string
        enabled:
          type: boolean
        unavailable_reason:
          type: string
      required:
      - code
      - display_name
      - enabled
      additionalProperties: false
    CatalogItem:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        item_code:
          type: string
        category:
          type: string
        name:
          type: string
        source_asset_id:
          type: string
        seller_name:
          type: string
        seller_product_url:
          type: string
          format: uri
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - DRAFT
          - QUALITY_PENDING
          - PUBLISHED
          - UNPUBLISHED
          - DISABLED
      required:
      - id
      - item_code
      - category
      - name
      - source_asset_id
      - status
      additionalProperties: false
    CatalogItemPatch:
      type: object
      properties:
        item_code:
          type: string
        category:
          type: string
        name:
          type: string
        source_asset_id:
          type: string
        seller_product_url:
          type: string
          format: uri
        attributes:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - DRAFT
          - QUALITY_PENDING
          - PUBLISHED
          - UNPUBLISHED
          - DISABLED
      required: []
      additionalProperties: false
    CaseResolution:
      type: object
      properties:
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - RESOLVED
          - REJECTED
        resolution:
          type: string
        reason:
          type: string
          minLength: 4
      required:
      - status
      - reason
      additionalProperties: false
    CatalogItemCreate:
      type: object
      properties:
        item_code:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        source_asset_id:
          type: string
        seller_product_url:
          type: string
          format: uri
        attributes:
          type: object
          additionalProperties: true
      required:
      - item_code
      - category
      - name
      - source_asset_id
      additionalProperties: false
    UploadIntent:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [PERSON_SOURCE, PRODUCT_SOURCE]
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
      required:
      - asset_id
      - account_id
      - purpose
      - mime_type
      - size_bytes
      additionalProperties: false
    ConsentCreate:
      type: object
      properties:
        subject_asset_id:
          type: string
          format: uuid
        adult_confirmed:
          type: boolean
        depicted_person_permission:
          type: boolean
        transformation_approved:
          type: boolean
        retention_notice_acknowledged:
          type: boolean
        no_training_notice_acknowledged:
          type: boolean
      required:
      - subject_asset_id
      - adult_confirmed
      - depicted_person_permission
      - transformation_approved
      - retention_notice_acknowledged
      - no_training_notice_acknowledged
      additionalProperties: false
    Consent:
      type: object
      properties:
        id:
          type: string
        accepted_at:
          type: string
          format: date-time
        consent_version:
          type: string
        purpose:
          type: string
      required:
      - id
      - accepted_at
      - consent_version
      - purpose
      additionalProperties: false
    QuoteRequest:
      type: object
      properties:
        item_asset_id:
          type: string
          format: uuid
      required:
      - item_asset_id
      additionalProperties: false
    Quote:
      type: object
      properties:
        quote_id:
          type: string
          format: uuid
        remaining_allowance:
          type: integer
          minimum: 1
          maximum: 3
        expires_at:
          type: string
          format: date-time
        disclaimer:
          type: string
      required:
      - quote_id
      - remaining_allowance
      - expires_at
      - disclaimer
      additionalProperties: false
    RenderCreate:
      type: object
      properties:
        quote_id:
          type: string
          format: uuid
      required:
      - quote_id
      additionalProperties: false
    RenderJob:
      type: object
      properties:
        render_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - PROCESSING
          - QUALITY_CHECK
          - SUCCEEDED
          - FAILED
          - CANCELLED
        charge_status:
          type: string
          enum:
          - RESERVED
          - SETTLED
          - RELEASED
          - RECREDITED
        cost_wearo_tokens:
          type: integer
          minimum: 0
        error_code:
          type: string
        source_item_id:
          type: string
        result_asset_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        status_url:
          type: string
      required:
      - render_id
      - status
      - charge_status
      - cost_wearo_tokens
      additionalProperties: false
    RenderAssets:
      type: object
      properties:
        person_original_signed_url:
          type: string
          format: uri
        product_source_signed_url:
          type: string
          format: uri
        result_signed_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        is_ai_generated:
          type: boolean
        fit_disclaimer:
          type: string
      required:
      - product_source_signed_url
      - is_ai_generated
      - fit_disclaimer
      additionalProperties: false
    Feedback:
      type: object
      properties:
        positive:
          type: boolean
        reason:
          type: string
          enum:
          - WRONG_FACE
          - WRONG_COLOR
          - WRONG_PRODUCT_DETAIL
          - WRONG_DRAPE
          - OTHER
        comment:
          type: string
          maxLength: 500
      required:
      - positive
      additionalProperties: false
    Report:
      type: object
      properties:
        reason:
          type: string
          enum:
          - INACCURATE
          - HARMFUL
          - UNWANTED
          - OTHER
        details:
          type: string
          maxLength: 500
        remove_result:
          type: boolean
      required:
      - reason
      additionalProperties: false
    Wallet:
      type: object
      properties:
        account_id:
          type: string
        purchased_tokens:
          type: integer
          minimum: 0
        promo_tokens:
          type: integer
          minimum: 0
        reserved_tokens:
          type: integer
          minimum: 0
        available_tokens:
          type: integer
          minimum: 0
        currency_units:
          type: string
          enum:
          - WEARO_TOKEN
      required:
      - account_id
      - purchased_tokens
      - promo_tokens
      - reserved_tokens
      - available_tokens
      - currency_units
      additionalProperties: false
    WalletTxn:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        amount_signed:
          type: integer
        created_at:
          type: string
          format: date-time
        reference_id:
          type: string
      required:
      - id
      - type
      - amount_signed
      - created_at
      additionalProperties: false
    TokenPack:
      type: object
      properties:
        id:
          type: string
        audience:
          type: string
          enum:
          - B2C
          - B2B
          - BOTH
        token_quantity:
          type: integer
          minimum: 1
        base_price_paise:
          type: integer
          minimum: 0
        discount_paise:
          type: integer
          minimum: 0
        final_price_paise:
          type: integer
          minimum: 0
        effective_from:
          type: string
          format: date-time
      required:
      - id
      - audience
      - token_quantity
      - base_price_paise
      - discount_paise
      - final_price_paise
      additionalProperties: false
    PaymentCreate:
      type: object
      properties:
        token_pack_id:
          type: string
        invoice_details_confirmed:
          type: boolean
      required:
      - token_pack_id
      - invoice_details_confirmed
      additionalProperties: false
    PaymentOrder:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - CREATED
          - PENDING
          - CONFIRMED
          - FAILED
          - REFUNDED
        provider_checkout_data:
          type: object
          additionalProperties: true
        amount_paise:
          type: integer
        token_quantity:
          type: integer
      required:
      - id
      - status
      - amount_paise
      - token_quantity
      additionalProperties: false
