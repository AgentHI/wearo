openapi: 3.1.0
info:
  title: wearo.ai MVP API contract
  version: 1.0.0-draft
  description: Contract-first MVP API proposal. Product scope controlled by the uploaded MVP v1.0 (90
    selected WR-IDs). All endpoint paths, sample values, TTL and stack choices must be approved via
    DEC log; do not treat them as new product requirements.
servers:
- url: /api/v1
  description: Same origin, pilot API gateway
