[project]
name = "wearo-ai"
version = "0.0.0"
description = "Wearo.ai MVP backend and worker"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "google-auth>=2.38,<3",
  "psycopg[binary]>=3.2,<4",
  "pillow>=11,<13",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the disposable PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".venv", "docs/sdd"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps", "scripts", "tests"]
ignore_missing_imports = true
